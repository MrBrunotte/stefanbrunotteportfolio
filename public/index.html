<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta name="theme-color" content="#000000" />

    <!-- BASIC SEO -->
    <title>Stefan Brunotte | Technical Support Portfolio</title>

    <meta
      name="description"
      content="Stefan Brunotte's professional portfolio covering technical support, Microsoft 365, systems, certifications and selected technical projects."
    />

    <!-- FAVICON -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon_red.ico"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- CANONICAL URL -->
    <link
      rel="canonical"
      href="https://mrbrunotte.github.io/stefanbrunotteportfolio/"
    />

    <!-- OPEN GRAPH / LINKEDIN -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Stefan Brunotte | Technical Support Portfolio"
    />

    <meta
      property="og:description"
      content="Personal portfolio covering my background in technical support, Microsoft 365, systems, certifications and selected technical projects."
    />

    <meta
      property="og:url"
      content="https://mrbrunotte.github.io/stefanbrunotteportfolio/"
    />

    <meta
      property="og:image"
      content="https://mrbrunotte.github.io/stefanbrunotteportfolio/portfolio-preview.png?v=2"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="627"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="Stefan Brunotte Technical Support Portfolio"
    />

    <meta
      property="og:site_name"
      content="Stefan Brunotte Portfolio"
    />

    <!-- TWITTER / OTHER SOCIAL PREVIEWS -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Stefan Brunotte | Technical Support Portfolio"
    />

    <meta
      name="twitter:description"
      content="Personal portfolio covering my background in technical support, Microsoft 365, systems, certifications and selected technical projects."
    />

    <meta
      name="twitter:image"
      content="https://mrbrunotte.github.io/stefanbrunotteportfolio/portfolio-preview.png?v=2"
    />

    <meta
      name="twitter:image:alt"
      content="Stefan Brunotte Technical Support Portfolio"
    />

    <!-- WEB APP MANIFEST -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- GOOGLE FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Notable&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
